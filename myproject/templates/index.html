<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download MP3</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">

    <style>
        :root {
            --color-1: #06141B;
            --color-2: #11212D;
            --color-3: #253745;
            --color-4: #4A5C6A;
            --color-5: #9BA8AB;
            --color-6: #CCD0CF;
        }

        body {
            background: linear-gradient(160deg, var(--color-1) 0%, var(--color-2) 35%, var(--color-3) 65%, var(--color-4) 100%);
            min-height: 100vh;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: var(--color-6);
        }

        .navbar {
            background-color: rgba(6, 20, 27, 0.85) !important;
            backdrop-filter: blur(8px);
            border-bottom: 1px solid var(--color-3);
        }

        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
            color: var(--color-6) !important;
        }

        .navbar-brand i {
            color: var(--color-5);
        }

        .main-card {
            border: none;
            border-radius: 1.25rem;
            background-color: var(--color-2);
            border: 1px solid var(--color-3);
        }

        .card-title {
            color: var(--color-6);
        }

        .form-label {
            color: var(--color-6);
        }

        .form-control {
            background-color: var(--color-1);
            border: 1px solid var(--color-4);
            color: var(--color-6);
        }

        .form-control::placeholder {
            color: var(--color-5);
            opacity: 0.7;
        }

        .form-control:focus {
            background-color: var(--color-1);
            border-color: var(--color-5);
            color: var(--color-6);
            box-shadow: 0 0 0 0.25rem rgba(155, 168, 171, 0.25);
        }

        .btn-danger {
            background-color: var(--color-4);
            border-color: var(--color-4);
            color: var(--color-6);
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .btn-danger:hover {
            background-color: var(--color-5);
            border-color: var(--color-5);
            color: var(--color-1);
        }

        .btn-success {
            background-color: var(--color-5);
            border-color: var(--color-5);
            color: var(--color-1);
            font-weight: 600;
            transition: all 0.25s ease;
        }

        .btn-success:hover {
            background-color: var(--color-6);
            border-color: var(--color-6);
            color: var(--color-1);
        }

        .alert {
            background-color: var(--color-3);
            border: 1px solid var(--color-4);
            color: var(--color-6);
        }

        .btn-close {
            filter: invert(1) grayscale(100%) brightness(200%);
        }

        .social-btn {
            font-size: 1.3rem;
            margin-left: 0.75rem;
            color: var(--color-6) !important;
            transition: transform 0.2s ease, color 0.2s ease;
        }

        .social-btn:hover {
            transform: scale(1.15);
            color: var(--color-5) !important;
        }

        audio {
            width: 100%;
            filter: invert(0.85) sepia(0.1) saturate(0.5);
            border-radius: 2rem;
        }

        footer {
            color: var(--color-5) !important;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="fa-solid fa-music me-2"></i>Baixador de MP3
            </span>
            <div class="d-flex align-items-center">
                <a class="text-white social-btn" href="https://github.com/SEU_USUARIO" target="_blank" title="GitHub">
                    <i class="fa-brands fa-github"></i>
                </a>
                <a class="text-white social-btn" href="https://linkedin.com/in/SEU_PERFIL" target="_blank" title="LinkedIn">
                    <i class="fa-brands fa-linkedin"></i>
                </a>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                {% if messages %}
                <section class="mb-4">
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'info' }} alert-dismissible fade show" role="alert">
                        <i class="fa-solid fa-circle-info me-2"></i>{{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                    {% endfor %}
                </section>
                {% endif %}

                <section>
                    <div class="card main-card shadow-lg mb-4">
                        <div class="card-body p-4 p-md-5">
                            <h2 class="card-title text-center mb-4">
                                <i class="fa-brands fa-youtube text-danger me-2"></i>Insira aqui sua URL
                            </h2>
                            <form method="POST">
                                {% csrf_token %}
                                <div class="mb-3">
                                    <label for="url" class="form-label fw-semibold">Youtube URL:</label>
                                    <input type="text" class="form-control form-control-lg" id="url" name="url_digitada" value="{{ url_digitada }}" placeholder="https://www.youtube.com/watch?v=...">
                                </div>
                                <button type="submit" class="btn btn-danger w-100 btn-lg">
                                    <i class="fa-solid fa-download me-2"></i>Baixar audio
                                </button>
                            </form>
                        </div>
                    </div>
                </section>

                {% if audio_baixado %}
                <section>
                    <div class="card main-card shadow-lg">
                        <div class="card-body p-4 p-md-5">
                            <h5 class="card-title mb-3">
                                <i class="fa-solid fa-headphones me-2"></i>Seu áudio está pronto!
                            </h5>
                            <audio controls class="mb-3">
                                <source src="/media/audiobaixado.m4a">
                                Seu navegador não suporta o elemento de áudio.
                            </audio>
                            <a href="/media/audiobaixado.m4a" download="audiobaixado.m4a" class="d-block">
                                <button type="button" class="btn btn-success w-100">
                                    <i class="fa-solid fa-file-arrow-down me-2"></i>Download
                                </button>
                            </a>
                        </div>
                    </div>
                </section>
                {% endif %}

            </div>
        </div>
    </main>

    <footer class="text-center text-white-50 py-4">
        <small>&copy; {% now "Y" %} Baixador de MP3</small>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
